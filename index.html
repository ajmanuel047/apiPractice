<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div>
      <h3>Search Giphy Below</h3>
      <search>
        <form>
          <input type="text" name="" id="" />
          <button id="submit">Search</button>
        </form>
      </search>

      <div id="giphyDiv">
        <img src="" />
      </div>
    </div>

    <script>
      const searchForGiphy = document.querySelector("#submit");
      const displayGiphy = document.getElementById("displayGiphy");
      const input = document.querySelector("input");

      searchForGiphy.addEventListener("click", (e) => {
        let userInput = input.value;
        input.value = "";
        const img = document.querySelector("img");
        async function getApi() {
          try {
            const response = await fetch(
              `https://api.giphy.com/v1/gifs/translate?api_key=grksfaAoRjQCIQtgyi4spveGCW5MBY&s=${userInput}&rating=g`
            );
            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }
            const getData = await response.json();
            img.src = getData.data.images.original.url;
          } catch (error) {
            console.error("Error fetching the image:", error);
          }
        }
        getApi();
        e.preventDefault();
      });
    </script>

    <style>
      h3 {
        text-align: center;
      }

      form {
        margin: auto;
        width: 500px;
        display: flex;
        flex-direction: column;
      }

      input {
        margin: auto;
      }

      #submit {
        width: 100px;
        margin: auto;
        margin-top: 10px;
      }

      #displayGiphy {
        margin-top: 20px;
      }

      #giphyDiv {
        display: flex;
        flex-direction: column;
        width: 400px;
        margin: auto;
        margin-top: 10px;
      }

      #displayGiphy {
        width: 100px;
        margin: auto;
      }

      img {
        margin: auto;
        margin-top: 10px;
      }
    </style>
  </body>
</html>
